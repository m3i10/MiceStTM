
; =============================================================================
; MiceStTM - Configuration File
; =============================================================================
;
; Application : MiceStTM
; File        : micesttm.ini
; Description : Main application configuration
;
; This file contains the configuration settings for speech recognition,
; text-to-speech, document scanning, language selection and microphone control.
;
; Edit the settings according to your system configuration.
; Restart the application after making changes.
;
; =============================================================================


; -----------------------------------------------------------------------------
; [micesttm] - Main application configuration
; -----------------------------------------------------------------------------

[micesttm]

; Wake word used to activate speech recognition
wakeword = computer

; Path to the Vosk speech recognition model
speech_model_path = /opt/micesttm/model/vosk-model-small-en-us-0.15


; -----------------------------------------------------------------------------
; Language configuration
; -----------------------------------------------------------------------------
;
; Select the desired language by uncommenting the corresponding settings.
; Make sure that the speech model, macros and word list match the language.
;


; English configuration
; -----------------------------------------------------------------------------
macro_path = $HOME/.config/micesttm/macros/en
upper_word_list_file = x

; German configuration
; -----------------------------------------------------------------------------
; macro_path = $HOME/.config/micesttm/macros/de
; upper_word_list_file = upper_word_list_de


; Main macro configuration files
; -----------------------------------------------------------------------------

main_macro_file = macro
number_replace_file = number_replace
speech_replace_file = speech_replace


; Text-to-speech player
; -----------------------------------------------------------------------------
;
; Alternative: Use an external media player such as mpv.
;

tts_player = /opt/micesttm/share/play.py

; tts_player = mpv --no-config --really-quiet --no-video --no-input-terminal --audio-channels=mono --speed=1.2


; Speaker control
; -----------------------------------------------------------------------------
;
; When using a media player, it is recommended to mute the speakers
; before speech playback. This function may not work reliably on all systems.
;

mutespeaker = pactl -- set-sink-mute 0 1
unmutespeaker = pactl -- set-sink-mute 0 0


; Sound signal played by the application
signal = /opt/micesttm/speechrecognition/ping.wav



; =============================================================================
; [say] - Text-to-speech configuration
; =============================================================================

[say]

; Piper voice models:
; https://huggingface.co/rhasspy/piper-voices/tree/main


; German voice model
; -----------------------------------------------------------------------------
; pipermodeldir = /opt/micesttm/voice/de_DE-thorsten-low.onnx


; English voice model
; -----------------------------------------------------------------------------
pipermodeldir = /opt/micesttm/voice/en_US-kathleen-low.onnx


; =============================================================================
; [scanner] - Document scanner configuration
; =============================================================================

[scanner]

; Directory where scanned documents are stored
outputdir = /MiceStTM/letter

; Output text filename
outputtext = text.txt

; Original scanned image
original = letter_original.png

; Rotated original image
original_rotate = letter_rotated.png

; Inverted and rotated image
rotate_invert = letter_invert_and_rotated.png


; Spoken status and error messages
; -----------------------------------------------------------------------------

; Message displayed while scanning a document
say_scan_letter = The letter is being scanned. This will take a moment! The document is saved under the filenames: letter_original.png, letter_rotated.png, and letter_inverted_and_rotated.png. The voice commands show scan or show letter directory will display the folder where the letter is located.

; Error message when no scanner is detected
say_error_no_scanner_found = Error! No scanner found

; Warning when the configured directory cannot be found
say_path_not_found = Warning! Error! Edit directory not found, edit the most dot ini file.

; Message displayed while processing
say_please_wait = Please Wait!

# for German
#say_scan_letter = Der Brief wird gescannt. Das dauert etwas! Das Dokument wird unter Mice STTM lätter Datei Name: lätter original. Punkt. P. N. Gehhh.!! gespeichert. Und unter lätter roäited. Punkt. P. N. G.!!!., und lätter_invört_and_rotaited. Der Sprach Befehl, scän anzeigen oder Brief Verzeichnis anzeigen, zeigen das Verzeichnis an, indem der Brief steht
#say_error_no_scanner_found = Achtung Fehler! keinen Scanner gefunden
#say_path_not_found = Achtung Fehler! Bearbeitungsverzeichnis nicht gefunden, bearbeiten sie die meiß punkt ini
#say_please_wait = Bitte warten!

; =============================================================================
; [language] - Language and OCR configuration
; =============================================================================

[language]

; Language used for scanner-related speech output
scanner_language = en

; Tesseract OCR language code
; eng = English
; deu = German
tesseract_language = eng



; =============================================================================
; [micautogain] - Automatic microphone gain configuration
; =============================================================================

[micautogain]

; Maximum microphone input level
max_micpegel = 65536

; Maximum permitted audio amplitude
max_amplitude = 15000



; =============================================================================
; [file_read__watcher] - File monitoring configuration
; =============================================================================

[file_read__watcher]

; Directory monitored for new files to read aloud
path_to_watch = $HOME/MiceStTM/read_aloud



; =============================================================================
; [tts] - Text-to-speech playback settings
; =============================================================================
;
; These options apply to the custom play.py audio player.
; Location: /opt/micesttm/share/play.py
;

[tts]

; Speech playback speed
speed = 1.60

; Playback volume
volume = 1.20

; Voice pitch adjustment
pitch = -2.00


; =============================================================================
; End of configuration file
; =============================================================================

